<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="582" viewBox="0 0 1100 582" font-family="Noto Sans, Segoe UI, sans-serif">
<text x="24" y="26" font-size="16" font-weight="700" fill="#2c3145">Where a VM gets written — first match wins</text>
<text x="24" y="48" font-size="12" fill="#626a85">Checked per machine, top to bottom. The same four rungs decide the VHD path.</text>
<line x1="46" y1="96" x2="46" y2="408" stroke="#d7deec" stroke-width="2"/>
<circle cx="46" cy="117.0" r="13" fill="#dfe6f9" stroke="#a9bcec"/>
<text x="46" y="121.5" font-size="12" font-weight="700" text-anchor="middle" fill="#3457c4">1</text>
<rect x="72" y="78" width="1004" height="78" rx="8" fill="#ffffff" stroke="#d7deec"/>
<g transform="translate(88 92) scale(1.1111)"><g fill="#4a8b2f"><polygon points="9,1.6 16.2,5.6 16.2,12.4 9,16.4 1.8,12.4 1.8,5.6"/></g><g fill="none" stroke="#325526" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><path d="M1.8 5.6L9 9.6l7.2-4M9 9.6v6.6"/></g></g>
<text x="118" y="105" font-size="13.5" font-weight="700" fill="#2c3145">Per-VM paths</text>
<text x="118" y="123" font-size="11.5" fill="#7b839c">Virtual machines → the VM card → Storage paths</text>
<text x="118" y="142" font-size="11.5" fill="#626a85">Set on one machine, and that machine ignores everything below.</text>
<rect x="836.0" y="103.0" width="224" height="28" rx="6" fill="#f7f9fd" stroke="#d7deec"/>
<text x="948" y="122.0" font-size="12.5" font-family="Noto Sans Mono, Consolas, monospace" text-anchor="middle" fill="#3457c4">C:\ClusterStorage\csv-02\VMs</text>
<circle cx="46" cy="207.0" r="13" fill="#f7f9fd" stroke="#d7deec"/>
<text x="46" y="211.5" font-size="12" font-weight="700" text-anchor="middle" fill="#626a85">2</text>
<rect x="72" y="168" width="1004" height="78" rx="8" fill="#ffffff" stroke="#d7deec"/>
<g transform="translate(88 182) scale(1.1111)"><g fill="#1d7fa8"><rect x="1.6" y="1.6" width="14.8" height="14.8" rx="2.4"/></g><g fill="none" stroke="#194f68" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><rect x="4.4" y="4.4" width="4" height="4" rx=".8"/><rect x="9.6" y="4.4" width="4" height="4" rx=".8"/><rect x="4.4" y="9.6" width="4" height="4" rx=".8"/><rect x="9.6" y="9.6" width="4" height="4" rx=".8"/></g></g>
<text x="118" y="195" font-size="13.5" font-weight="700" fill="#2c3145">Automatic storage placement</text>
<text x="118" y="213" font-size="11.5" fill="#7b839c">Failover Cluster → Storage placement, mode auto</text>
<text x="118" y="232" font-size="11.5" fill="#626a85">Each VM lands on the volume with the most free space at its turn.</text>
<rect x="836.0" y="193.0" width="224" height="28" rx="6" fill="#f7f9fd" stroke="#d7deec"/>
<text x="948" y="212.0" font-size="12.5" font-family="Noto Sans Mono, Consolas, monospace" text-anchor="middle" fill="#3457c4">C:\ClusterStorage\csv-01\VMs</text>
<circle cx="46" cy="297.0" r="13" fill="#f7f9fd" stroke="#d7deec"/>
<text x="46" y="301.5" font-size="12" font-weight="700" text-anchor="middle" fill="#626a85">3</text>
<rect x="72" y="258" width="1004" height="78" rx="8" fill="#ffffff" stroke="#d7deec"/>
<g transform="translate(88 272) scale(1.1111)"><g fill="#1d7fa8"><rect x="1.8" y="3" width="14.4" height="2.4" rx="1.2"/><rect x="1.8" y="7.8" width="14.4" height="2.4" rx="1.2"/><rect x="1.8" y="12.6" width="14.4" height="2.4" rx="1.2"/></g><g fill="none" stroke="#194f68" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><circle cx="5.4" cy="4.2" r="1.6"/><circle cx="11.4" cy="9" r="1.6"/><circle cx="7" cy="13.8" r="1.6"/></g></g>
<text x="118" y="285" font-size="13.5" font-weight="700" fill="#2c3145">General Settings</text>
<text x="118" y="303" font-size="11.5" fill="#7b839c">General Settings → Paths</text>
<text x="118" y="322" font-size="11.5" fill="#626a85">The default every machine uses when nothing above applies.</text>
<rect x="1001.0" y="283.0" width="59" height="28" rx="6" fill="#f7f9fd" stroke="#d7deec"/>
<text x="1030" y="302.0" font-size="12.5" font-family="Noto Sans Mono, Consolas, monospace" text-anchor="middle" fill="#3457c4">D:\vms</text>
<circle cx="46" cy="387.0" r="13" fill="#f7f9fd" stroke="#d7deec"/>
<text x="46" y="391.5" font-size="12" font-weight="700" text-anchor="middle" fill="#626a85">4</text>
<rect x="72" y="348" width="1004" height="78" rx="8" fill="#ffffff" stroke="#d7deec"/>
<g transform="translate(88 362) scale(1.1111)"><g fill="#1d7fa8"><polygon points="9,1.4 15.6,4.6 9,7.8 2.4,4.6"/><polygon points="9,5.8 15.6,9 9,12.2 2.4,9"/><polygon points="9,10.2 15.6,13.4 9,16.6 2.4,13.4"/></g><g fill="none" stroke="#194f68" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><path d="M2.4 9L9 5.8 15.6 9M2.4 13.4L9 10.2l6.6 3.2"/></g></g>
<text x="118" y="375" font-size="13.5" font-weight="700" fill="#2c3145">Left blank</text>
<text x="118" y="393" font-size="11.5" fill="#7b839c">The host's own default, read with Get-VMHost</text>
<text x="118" y="412" font-size="11.5" fill="#626a85">Whatever Hyper-V Settings on that host already says. Nothing is asked.</text>
<rect x="993.5" y="373.0" width="66" height="28" rx="6" fill="#f7f9fd" stroke="#d7deec"/>
<text x="1027" y="392.0" font-size="12.5" font-family="Noto Sans Mono, Consolas, monospace" text-anchor="middle" fill="#3457c4">D:\vms\</text>
<rect x="24" y="444" width="1052" height="116" rx="8" fill="#f7f9fd" stroke="#d7deec"/>
<text x="42" y="468" font-size="12.5" fill="#626a85">Whichever root wins, the leaf folder from <tspan font-weight="700" fill="#2c3145">Naming</tspan> is appended to it:</text>
<g transform="translate(42 482) scale(0.8889)"><g fill="#1d7fa8"><ellipse cx="9" cy="4.2" rx="6.4" ry="2.5"/><path d="M2.6 4.2v9.6c0 1.4 2.9 2.5 6.4 2.5s6.4-1.1 6.4-2.5V4.2z"/></g><g fill="none" stroke="#194f68" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><path d="M2.9 8.4c1.4.9 3.6 1.5 6.1 1.5s4.7-.6 6.1-1.5M2.9 12c1.4.9 3.6 1.5 6.1 1.5s4.7-.6 6.1-1.5"/></g></g>
<text x="66" y="495" font-size="13" font-family="Noto Sans Mono, Consolas, monospace" fill="#626a85">C:\ClusterStorage\csv-01\VMs\</text>
<g transform="translate(322 482) scale(0.8889)"><g fill="#4a8b2f"><path d="M1.6 4.6a1.2 1.2 0 0 1 1.2-1.2h4l1.6 1.8h6.8a1.2 1.2 0 0 1 1.2 1.2v7.6a1.2 1.2 0 0 1-1.2 1.2H2.8a1.2 1.2 0 0 1-1.2-1.2z"/></g><g fill="none" stroke="#325526" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"><path d="M1.6 7.6h14.8"/></g></g>
<text x="346" y="495" font-size="13" font-family="Noto Sans Mono, Consolas, monospace" fill="#4a8b2f">dc-01\</text>
<text x="42" y="522" font-size="11.5" fill="#7b839c">Set only vmPath on a VM and placement is off for that machine entirely — the VHD path then falls back to the default, then to the VM path.</text>
</svg>