name: Feature request
description: Suggest something the lab tooling should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build
      description: The lab scenario you cannot express today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
      description: A studio blade, a script parameter, a new gold target — whatever fits.
    validations:
      required: true
